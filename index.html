<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jhon Velandia</title>
<meta name="description" content="Jhon Velandia — sitio en construcción.">
<style>
  :root{
    --bg: #0a0a09;
    --panel: #121210;
    --line: #232320;
    --text: #f1f0ec;
    --muted: #94938c;
    --accent: #2f8f6f;
    --accent-soft: rgba(47,143,111,0.14);
    --focus: #4fb894;
  }

  *{ box-sizing:border-box; }

  html,body{
    height:100%;
    margin:0;
  }

  body{
    background:var(--bg);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 8vh 6vw;
    line-height:1.5;
  }

  main{
    width:100%;
    max-width: 480px;
  }

  .mark{
    width: 34px;
    height: 3px;
    background: var(--accent);
    margin-bottom: 28px;
    border-radius: 2px;
  }

  h1{
    font-size: clamp(2rem, 6vw, 2.6rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0 0 18px;
  }

  p.lead{
    color: var(--muted);
    font-size: 1.05rem;
    max-width: 46ch;
    margin: 0 0 40px;
  }

  form{
    display:flex;
    flex-direction:column;
    gap: 12px;
    margin-bottom: 14px;
  }

  label{
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 4px;
    display:block;
  }

  input, textarea{
    width:100%;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 0.95rem;
    font-family: inherit;
    resize: vertical;
    transition: border-color .15s ease;
  }

  textarea{ min-height: 96px; }

  input:focus, textarea:focus{
    outline: none;
    border-color: var(--focus);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  button{
    background: var(--accent);
    color: #06120d;
    border: none;
    border-radius: 8px;
    padding: 12px 18px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: filter .15s ease, transform .05s ease;
  }

  button:hover{ filter: brightness(1.08); }
  button:active{ transform: translateY(1px); }
  button:disabled{ opacity: .6; cursor: default; }

  button:focus-visible, input:focus-visible, textarea:focus-visible{
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .status{
    font-size: 0.9rem;
    min-height: 1.2em;
    margin-top: 4px;
  }
  .status.ok{ color: var(--accent); }
  .status.err{ color: #d97a6c; }

  footer{
    margin-top: 36px;
    color: var(--muted);
    font-size: 0.8rem;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true"></div>
  <h1>Jhon Velandia</h1>
  <p class="lead">
    Estoy dando forma a este espacio. En poco tiempo vas a encontrar aquí mi
    trabajo. Si mientras tanto quieres contarme algo, escríbeme abajo y te
    respondo directo a tu correo.
  </p>

  <form id="contact-form">
    <div>
      <label for="email">Tu correo</label>
      <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required>
    </div>
    <div>
      <label for="message">Mensaje</label>
      <textarea id="message" name="message" placeholder="Escribe aquí tu mensaje" required></textarea>
    </div>
    <button type="submit" id="submit-btn">Enviar mensaje</button>
    <p class="status" id="form-status" role="status" aria-live="polite"></p>
  </form>

  <footer>&copy; <span id="year"></span> Jhon Velandia</footer>
</main>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  const form = document.getElementById('contact-form');
  const btn = document.getElementById('submit-btn');
  const status = document.getElementById('form-status');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = 'Enviando…';
    status.textContent = '';
    status.className = 'status';

    try {
      const res = await fetch('https://formspree.io/f/xgavzdnw', {
        method: 'POST',
        headers: { 'Accept': 'application/json' },
        body: new FormData(form)
      });

      if (res.ok) {
        status.textContent = 'Gracias, tu mensaje fue enviado.';
        status.classList.add('ok');
        form.reset();
      } else {
        status.textContent = 'No se pudo enviar. Intenta de nuevo en un momento.';
        status.classList.add('err');
      }
    } catch (err) {
      status.textContent = 'Error de conexión. Intenta de nuevo.';
      status.classList.add('err');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Enviar mensaje';
    }
  });
</script>
</body>
</html>
